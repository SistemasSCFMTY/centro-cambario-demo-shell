<div
  class="flex h-16 items-center gap-2 rounded-2xl bg-chrome-card px-2.5 text-chrome-text ring-1 ring-chrome-line"
>
  <a
    routerLink="/inicio"
    class="flex h-11 shrink-0 items-center gap-3 rounded-full px-2 -outline-offset-2"
  >
    <app-logo-negocio tamano="sm" />
    <span class="hidden max-w-48 truncate text-headline lg:block">{{ nombreNegocio() }}</span>
    <span class="sr-only lg:hidden">{{ nombreNegocio() }}, ir a Inicio</span>
  </a>

  <nav aria-label="Principal" class="min-w-0 flex-1 lg:ms-4">
    <ul class="flex items-center gap-1">
      @for (elemento of elementos; track elemento.ruta) {
        <li>
          <a
            [routerLink]="['/', elemento.ruta]"
            routerLinkActive
            ariaCurrentWhenActive="page"
            class="group flex h-11 items-center gap-2.5 rounded-full px-3.5 text-body text-chrome-muted -outline-offset-2 hover:bg-chrome-hover hover:text-chrome-text md:px-4 pagina-actual:bg-chrome-raised pagina-actual:font-bold pagina-actual:text-chrome-text"
          >
            <ng-icon
              [name]="elemento.icono"
              size="18"
              aria-hidden="true"
              class="shrink-0 transition-colors group-pagina-actual:text-primary-400"
            />
            <span class="sr-only md:not-sr-only">{{ elemento.etiqueta }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <app-selector-modo />

  @if (usuario(); as u) {
    <button
      type="button"
      [hlmDropdownMenuTrigger]="menuUsuario"
      align="end"
      class="flex h-11 shrink-0 items-center gap-3 rounded-full ps-1 pe-1 text-start -outline-offset-2 hover:bg-chrome-hover xl:pe-4"
    >
      <span
        aria-hidden="true"
        class="inline-flex size-9 shrink-0 items-center justify-center rounded-full bg-primary-1000/60 text-subheadline font-bold text-primary-300 ring-1 ring-primary-400/30"
      >
        {{ iniciales() }}
      </span>
      <span class="hidden min-w-0 xl:block">
        <span class="block max-w-40 truncate text-callout font-bold">{{ nombreCompleto() }}</span>
        <span class="block truncate text-caption-1 text-chrome-muted">{{ etiquetaRol() }}</span>
      </span>
      <span class="sr-only xl:hidden">Abrir menú de usuario</span>
    </button>

    <ng-template #menuUsuario>
      <hlm-dropdown-menu class="w-60">
        <hlm-dropdown-menu-label>
          <span class="block truncate font-bold">{{ nombreCompleto() }}</span>
          <span class="block truncate font-normal text-ink-muted">{{ u.correo }}</span>
        </hlm-dropdown-menu-label>
        <hlm-dropdown-menu-separator />
        <button hlmDropdownMenuItem (triggered)="cerrarSesion()">
          <ng-icon name="lucideLogOut" size="16" aria-hidden="true" />
          Cerrar sesión
        </button>
      </hlm-dropdown-menu>
    </ng-template>
  } @else {
    <a
      routerLink="/acceso"
      class="flex h-11 shrink-0 items-center gap-2.5 rounded-full px-4 text-chrome-muted -outline-offset-2 hover:bg-chrome-hover hover:text-chrome-text"
    >
      <ng-icon name="lucideLogIn" size="18" aria-hidden="true" />
      <span class="sr-only md:not-sr-only">Iniciar sesión</span>
    </a>
  }
</div>
