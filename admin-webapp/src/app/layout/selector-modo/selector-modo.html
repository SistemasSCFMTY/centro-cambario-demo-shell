<button
  type="button"
  hlmBtn
  variant="outline"
  size="icon"
  [hlmDropdownMenuTrigger]="menuModo"
  align="end"
  class="rounded-full bg-panel/70"
>
  <ng-icon [name]="actual().icono" size="16" aria-hidden="true" />
  <span class="sr-only">Tema: {{ actual().etiqueta }}</span>
</button>

<ng-template #menuModo>
  <hlm-dropdown-menu class="w-44">
    <hlm-dropdown-menu-label>Tema</hlm-dropdown-menu-label>
    @for (opcion of opciones; track opcion.valor) {
      <button
        hlmDropdownMenuRadio
        [checked]="modo() === opcion.valor"
        [keepOpen]="false"
        (triggered)="establecer(opcion.valor)"
      >
        <ng-icon [name]="opcion.icono" size="16" aria-hidden="true" />
        {{ opcion.etiqueta }}
        <hlm-dropdown-menu-radio-indicator />
      </button>
    }
  </hlm-dropdown-menu>
</ng-template>
