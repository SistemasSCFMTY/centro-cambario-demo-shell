@if (noEncontrada()) {
  <app-record-not-found
    title="Operación"
    message="No encontramos esta operación"
    [backTo]="['/operaciones']"
    backLabel="Volver a operaciones"
  />
} @else {
  <app-detalle-pagina
    [titulo]="titulo()"
    [descripcion]="descripcion()"
    [volverA]="['/operaciones']"
    etiquetaVolver="Volver a operaciones"
    claveUrl="tab"
    [cargando]="cargando()"
    etiquetaCarga="Cargando operación"
    [(pestana)]="pestana"
  >
    @if (falla() && error(); as mensaje) {
      <app-error-notice [separated]="false" [message]="mensaje" (retry)="retry()" />
    }

    @if (pill(); as ajuste) {
      <app-pill-estatus meta [ajuste]="ajuste" />
    }

    @switch (pestana()) {
      @case ('auditoria') {
        <app-pestana-auditoria [registros]="auditoria()" />
      }
      @default {
        @for (seccion of secciones(); track seccion.id; let primera = $first) {
          <section
            class="px-8 py-8"
            [class.border-t]="!primera"
            [class.border-line]="!primera"
            [attr.aria-labelledby]="'seccion-' + seccion.id"
          >
            <header>
              <h2 [id]="'seccion-' + seccion.id">{{ seccion.titulo }}</h2>
              <p class="max-w-prose text-callout text-ink-muted">{{ seccion.descripcion }}</p>
            </header>
            <app-cuadricula-campos [campos]="seccion.campos" [columnas]="3" />
          </section>
        }
      }
    }
  </app-detalle-pagina>
}
