<article class="panel animate-page-in">
  <app-encabezado-pagina [titulo]="elemento().etiqueta" [descripcion]="elemento().descripcion" />

  <section class="border-t border-line">
    <div class="flex min-h-60 flex-col items-center justify-center gap-3 p-8 text-center">
      <ng-icon
        [name]="elemento().icono"
        size="28"
        [strokeWidth]="1.5"
        class="text-ink-subtle"
        aria-hidden="true"
      />
      <div>
        <h2 class="text-headline">Este módulo todavía no está disponible</h2>
        <p class="text-callout text-ink-muted">Se habilita en una siguiente fase del proyecto.</p>
      </div>
    </div>
  </section>
</article>
