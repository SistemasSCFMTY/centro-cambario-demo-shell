<article class="panel animate-page-in">
  <app-encabezado-pagina
    [titulo]="titulo()"
    [descripcion]="descripcion()"
    [volverA]="['/negocio']"
    [volverParametros]="volverParametros"
    etiquetaVolver="Volver a negocio"
  />

  @if (!listo()) {
    @if (errorCarga(); as message) {
      <app-error-notice [message]="message" (retry)="retryLoad()" />
    } @else {
      <div class="border-t border-line px-8 py-8" role="status" aria-label="Cargando sucursal">
        <span class="skeleton max-w-24"></span>
        <div class="mt-4 grid gap-x-6 gap-y-4 sm:grid-cols-2">
          @for (campo of [1, 2, 3, 4]; track campo) {
            <div>
              <span class="skeleton max-w-24"></span>
              <span class="skeleton mt-2 max-w-48"></span>
            </div>
          }
        </div>
      </div>
    }
  } @else {
    @if (errorGuardado(); as message) {
      <app-error-notice [message]="message" [showRetry]="false" />
    }
    @for (seccion of secciones; track seccion.id) {
      <app-seccion-negocio
        [seccion]="seccion"
        [grupo]="formulario"
        [opciones]="opciones()"
        [prefijo]="fieldPrefix"
        [cargandoGeografia]="cargandoGeografia()"
        [errorGeografia]="errorGeografia()"
      />
    }
  }

  <app-barra-acciones
    [guardando]="guardando()"
    [guardarDeshabilitado]="!listo()"
    [etiquetaGuardar]="id ? 'Guardar cambios' : 'Agregar sucursal'"
    (cancelar)="cancelar()"
    (guardar)="guardar()"
  >
    @if (attentionMessage(); as message) {
      <span role="alert">{{ message }}</span>
    }
  </app-barra-acciones>

  <app-discard-changes-dialog [(open)]="discardOpen" (discard)="volver()" />
</article>
